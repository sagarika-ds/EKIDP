version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ekidp-postgres
    environment:
      POSTGRES_DB: ekidp
      POSTGRES_USER: ekidp_user
      POSTGRES_PASSWORD: ekidp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: ekidp-neo4j
    environment:
      NEO4J_AUTH: neo4j/ekidp_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: ekidp-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  chroma_data:
